name: Daily SEO Dashboard Sync & GitHub Pages Deploy

on:
  schedule:
    # Runs daily at 04:00 AM UTC (09:30 AM IST)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib pandas requests

      - name: Restore GSC Token from GitHub Secrets
        env:
          GSC_TOKEN_JSON: ${{ secrets.GSC_TOKEN_JSON }}
        run: |
          if [ -n "$GSC_TOKEN_JSON" ]; then
            echo "$GSC_TOKEN_JSON" > scripts/gsc_token.json
            echo "✅ GSC token restored from secrets."
          else
            echo "⚠️ GSC_TOKEN_JSON secret not set. Skipping live GSC API update."
          fi

      - name: Generate Dashboard Dataset
        run: |
          if [ -f scripts/gsc_token.json ]; then
            python scripts/generate_dashboard_dataset.py
          else
            echo "⏩ Using existing dashboard/dashboard_data.json."
          fi

      - name: Commit Updated Dataset to Repository
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dashboard/dashboard_data.json
          git commit -m "auto: daily SEO dashboard dataset sync [skip ci]" || echo "No data changes to commit"
          git push || echo "No changes pushed"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Dashboard Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dashboard'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
