name: Daily SEO Dashboard Sync & Email Report

on:
  schedule:
    # Primary run: ~09:47 AM IST (04:17 UTC) - off-peak minute avoids GitHub Actions queue backlog
    - cron: '17 4 * * *'
    # Backup run: ~10:23 AM IST (04:53 UTC) - ensures delivery if the primary queue is delayed
    - cron: '53 4 * * *'
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-sync"
  cancel-in-progress: false

jobs:
  sync-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure GSC Credentials
        env:
          GSC_TOKEN: ${{ secrets.GSC_TOKEN_JSON }}
        if: env.GSC_TOKEN != ''
        run: |
          echo "$GSC_TOKEN" > scripts/gsc_token.json

      - name: Run Dashboard Dataset Generator
        # Only run data generation on cron schedule or manual dispatch
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python3 scripts/generate_dashboard_dataset.py
          cp dashboard/dashboard_data.json ./dashboard_data.json

      - name: Commit & Push Updated Dataset
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/dashboard_data.json ./dashboard_data.json scripts/indexed_urls_history.json
          if git diff-index --quiet HEAD --; then
            echo "No new dashboard dataset changes to commit."
          else
            git commit -m "chore(cron): daily live SEO dashboard sync [skip ci]"
            git push origin main
          fi

      - name: Send Daily Email Performance Summary
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python3 scripts/send_daily_summary_email.py

  deploy-pages:
    needs: sync-and-report
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
